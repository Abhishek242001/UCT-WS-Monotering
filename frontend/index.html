<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UCT Workstation Monitor</title>
</head>
<body>
<script>
  // Deliberately minimal and dependency-free: just picks the right first
  // destination synchronously and gets out of the way. It does NOT
  // validate the token against the backend -- dashboard.html does that
  // itself on load (see js/dashboard.page.js:restoreSession), so this
  // avoids a redundant network round trip on every visit.
  //
  // NOTE: this key must stay in sync with SESSION_TOKEN_KEY in
  // js/api.js. It's duplicated here (rather than loading api.js just for
  // one constant) to keep this redirect instant.
  var hasStoredToken = !!sessionStorage.getItem('uct_session_token_v1');
  window.location.replace(hasStoredToken ? 'dashboard.html' : 'login.html');
</script>
<noscript>JavaScript is required. Please <a href="login.html">sign in</a>.</noscript>
</body>
</html>
