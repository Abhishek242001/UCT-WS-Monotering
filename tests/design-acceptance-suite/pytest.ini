[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    integration: requires a running database/service beyond the in-process mock
    slow: exercises larger datasets or repeated operations
    hardware: requires real GPU/CPU accelerator hardware (TensorRT/OpenVINO) to run for real
filterwarnings =
    ignore::DeprecationWarning
